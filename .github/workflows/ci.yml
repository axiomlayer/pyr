name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Every pull request, whatever it targets. Filtering this to main meant a
  # stacked PR ran no jobs at all, and GitHub reports "no checks" the same
  # way it reports a clean run: as nothing red. #40 carried the fix for a
  # bug that recursively uninstalls a venv and had zero check runs on it.
  # build, smoke and release are unaffected; they already exclude pull
  # requests or run only on tags.
  pull_request:

# Coalesce re-pushes to the same ref. Main and tag pushes live in different
# groups (different refs) so they both still run, but spamming a branch with
# fixup pushes no longer piles up concurrent runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '*.ts'
              - 'deno.json'
              - 'deno.lock'
              - '.github/workflows/**'
              - 'README.md'
              - 'site/assets/**'
              - 'site/routes/**'
  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: fmt
        run: deno fmt --check
      - name: lint
        run: deno lint
      - name: type check
        run: deno check main.ts lib.ts
      - name: test
        run: deno test -A

  verify:
    if: always()
    needs: [changes, check, windows-native]
    runs-on: ubuntu-latest
    steps:
      - name: pass
        run: |
          if [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "no code changes, skipping"
            exit 0
          fi
          if [ "${{ needs.check.result }}" = "success" ]; then
            if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ needs.windows-native.result }}" = "success" ]; then
              exit 0
            fi
          fi
          exit 1

  # PRs must exercise the binary on native Windows runners. The push-only
  # build/smoke matrix below protects main and release artifacts; this job
  # closes the review-time gap and runs the installer on both Windows
  # architectures. Older releases without the ARM64 ZIP exercise the
  # installer's explicit x86_64-emulation fallback on the ARM runner.
  windows-native:
    needs: check
    if: github.event_name == 'pull_request' && needs.check.result == 'success'
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            installer: true
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            installer: true
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: test on native Windows
        shell: pwsh
        run: deno test -A

      - name: compile native binary
        shell: pwsh
        run: deno compile -A --target ${{ matrix.target }} --output pyr.exe main.ts

      - name: native init and run
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $help = (& .\pyr.exe 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $help -notmatch "usage") { throw "native help failed" }
          & .\pyr.exe init smoketest
          if (-not (Test-Path smoketest\app\main.py)) { throw "native init did not scaffold" }
          Push-Location smoketest
          try {
            $output = (& ..\pyr.exe run 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $output -notmatch "hello world") { throw "native run failed: $output" }
          } finally {
            Pop-Location
          }

      - name: installer script
        if: matrix.installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYR_HOME = Join-Path $pwd "installer-home"
          & pwsh -NoProfile -NonInteractive -File .\site\assets\install.ps1
          $installed = Join-Path $env:PYR_HOME "bin\pyr.exe"
          if (-not (Test-Path $installed)) { throw "installer did not produce $installed" }
          $version = (& $installed --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "installed binary failed: $version" }

      # Git Bash must launch the native Windows binary, use USERPROFILE rather
      # than its POSIX-looking HOME, and keep using Windows' bundled tar.exe.
      - name: Git Bash native bootstrap
        shell: bash
        run: |
          set -euo pipefail
          profile="$(pwd -W)/git-bash-profile"
          decoy_home="$(pwd -W)/git-bash-home-decoy"
          export USERPROFILE="$profile"
          export HOME="$decoy_home"
          unset PYR_HOME
          ./pyr.exe init git-bash-smoketest
          test -f git-bash-smoketest/app/main.py
          test -f "$(cygpath -u "$profile")/.pyr/python/python.exe"
          test ! -e "$(cygpath -u "$decoy_home")/.pyr"
          output="$(cd git-bash-smoketest && ../pyr.exe run 2>&1)"
          printf '%s\n' "$output"
          grep -q "hello world" <<< "$output"

      # The TLS override in install.ps1 exists for Windows PowerShell 5.1.
      # Exercise that host explicitly on x86_64 in addition to PowerShell 7.
      - name: installer script (Windows PowerShell 5.1)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYR_HOME = Join-Path $pwd "installer-home-windows-powershell"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\site\assets\install.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell installer failed with exit code $LASTEXITCODE" }
          $installed = Join-Path $env:PYR_HOME "bin\pyr.exe"
          if (-not (Test-Path $installed)) { throw "installer did not produce $installed" }
          $version = (& $installed --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "installed binary failed: $version" }

  # Build every release target and upload each as a named artifact. The smoke
  # job pulls these artifacts back down and exercises them, so a failed
  # cross-compile blocks smoke on every platform — and smoke tests the exact
  # binary a release would ship.
  build:
    needs: check
    if: github.ref_type != 'tag' && github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: pyr-darwin-aarch64
            binary: pyr
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: pyr-darwin-x86_64
            binary: pyr
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: pyr-linux-x86_64
            binary: pyr
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: pyr-linux-aarch64
            binary: pyr
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pyr-windows-x86_64
            binary: pyr.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact: pyr-windows-aarch64
            binary: pyr.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: compile
        shell: bash
        run: deno compile -A --target ${{ matrix.target }} --output ${{ matrix.binary }} main.ts

      - name: zip (unix)
        if: runner.os != 'Windows'
        run: zip ${{ matrix.artifact }}.zip ${{ matrix.binary }}

      - name: zip (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ${{ matrix.artifact }}.zip

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  # Pull the native-target binary produced by `build` and exercise it on its
  # own OS. macos-latest runners are arm64, so we use the darwin-aarch64
  # artifact there. On Windows we rename pyr.exe -> pyr so the existing
  # `./pyr` invocations work uniformly across the OS matrix. windows-11-arm
  # is a GitHub-hosted arm64 runner that is free for public repos only.
  smoke:
    needs: build
    if: github.ref_type != 'tag' && github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: pyr-darwin-aarch64
          - os: ubuntu-latest
            artifact: pyr-linux-x86_64
          - os: windows-latest
            artifact: pyr-windows-x86_64
          - os: windows-11-arm
            artifact: pyr-windows-aarch64
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}

      - name: unzip (unix)
        if: runner.os != 'Windows'
        run: |
          unzip ${{ matrix.artifact }}.zip
          chmod +x pyr

      - name: unzip (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path ${{ matrix.artifact }}.zip -DestinationPath .
          Move-Item pyr.exe pyr

      - name: help
        shell: bash
        run: ./pyr | grep -q "usage"

      - name: init
        shell: bash
        run: |
          ./pyr init smoketest
          test -f smoketest/pyproject.toml
          test -f smoketest/app/main.py
          test -f smoketest/app/config.py
          test -f smoketest/requirements.txt
          test -d smoketest/.venv

      - name: run
        shell: bash
        run: |
          cd smoketest
          ../pyr run | grep -q "hello world"

      # add: covers single + multi-package + extras. Asserts the lock has the
      # pyr-generated header AND each top-level package; also asserts that the
      # specs ended up in pyproject.toml [project].dependencies.
      - name: add
        shell: bash
        run: |
          cd smoketest
          ../pyr add requests
          grep -q "^# generated by pyr" requirements.txt
          grep -q "^requests==" requirements.txt
          grep -q '"requests"' pyproject.toml
          ../pyr add "httpx[http2]" "rich>=13"
          grep -q "^httpx" requirements.txt
          grep -q "^rich" requirements.txt
          grep -q '"httpx\[http2\]"' pyproject.toml

      # remove: should drop the package from pyproject AND the lock; the venv
      # should no longer have it installed.
      - name: remove
        shell: bash
        run: |
          cd smoketest
          ../pyr remove requests
          ! grep -q "^requests==" requirements.txt
          ! grep -q '"requests"' pyproject.toml

      # sync after a manual pyproject edit. We hand-write `dependencies = ["click"]`
      # over the existing array, then run sync and assert click is locked +
      # importable.
      - name: sync after manual edit
        shell: bash
        run: |
          cd smoketest
          printf '%s\n' \
            '[project]' \
            'name = "smoketest"' \
            'version = "0.1.0"' \
            'requires-python = ">=3.11"' \
            'dependencies = ["click"]' \
            > pyproject.toml
          ../pyr sync
          grep -q "^click==" requirements.txt
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv/Scripts/python.exe -c "import click"
          else
            .venv/bin/python -c "import click"
          fi

      # sync should be a no-op when nothing has changed.
      - name: sync is idempotent
        shell: bash
        run: |
          cd smoketest
          cp requirements.txt requirements.before
          ../pyr sync
          diff requirements.txt requirements.before

  # On a v* tag, don't rebuild — find the main-branch ci run that already
  # built-and-smoked the tagged commit, pull its artifacts, and publish.
  # If no green main run exists for this SHA, fail loudly: tag only after
  # main is green.
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: find main ci run for this commit
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          run_id=$(gh run list \
            --repo "$REPO" \
            --workflow ci.yml \
            --branch main \
            --event push \
            --commit "$SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "no successful main ci run found for $SHA"
            echo "push to main and wait for ci to pass before tagging"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find.outputs.run_id }}
          merge-multiple: true

      - name: validate release artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            pyr-darwin-aarch64.zip
            pyr-darwin-x86_64.zip
            pyr-linux-aarch64.zip
            pyr-linux-x86_64.zip
            pyr-windows-aarch64.zip
            pyr-windows-x86_64.zip
          )
          for archive in "${expected[@]}"; do
            test -f "$archive"
          done
          actual_count=$(find . -maxdepth 1 -type f -name 'pyr-*.zip' | wc -l | tr -d ' ')
          test "$actual_count" -eq "${#expected[@]}"

      # A SHA256SUMS beside the zips lets an installer pin a release by digest
      # instead of trusting whatever "latest" resolves to on the day.
      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum *.zip > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.zip
            SHA256SUMS
