name: release-integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: format
        run: |
          deno fmt --check \
            release/pyr-v0.1.1.json \
            release/README.md \
            release_integrity_test.ts \
            scripts/verify-release-integrity.ts
      - name: lint and type check
        run: |
          deno lint release_integrity_test.ts scripts/verify-release-integrity.ts
          deno check release_integrity_test.ts scripts/verify-release-integrity.ts
      - name: tamper-negative tests
        env:
          PYR_TEST_TOKEN: fabricated-release-integrity-token
        run: deno test --allow-read release_integrity_test.ts

  published-assets:
    needs: manifest-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: verify every published release asset
        run: |
          deno run \
            --allow-net=api.github.com,github.com,release-assets.githubusercontent.com \
            --allow-read \
            scripts/verify-release-integrity.ts

  native-windows-release:
    needs: manifest-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x86_64
          - runner: windows-11-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5
      - name: download and verify pinned native asset
        shell: pwsh
        run: |
          deno run `
            --allow-net=api.github.com,github.com,release-assets.githubusercontent.com `
            --allow-read `
            --allow-write `
            scripts/verify-release-integrity.ts `
            --asset windows-${{ matrix.architecture }} `
            --output-dir .verified
      - name: execute matching PE on the native runner architecture
        shell: pwsh
        run: |
          .\scripts\verify-native-windows.ps1 `
            -Architecture '${{ matrix.architecture }}' `
            -Binary '.verified\pyr.exe' `
            -Manifest 'release\pyr-v0.1.1.json'

  verify:
    if: always()
    needs: [manifest-tests, published-assets, native-windows-release]
    runs-on: ubuntu-24.04
    steps:
      - name: require the complete release proof
        env:
          MANIFEST_TESTS: ${{ needs.manifest-tests.result }}
          PUBLISHED_ASSETS: ${{ needs.published-assets.result }}
          NATIVE_WINDOWS_RELEASE: ${{ needs.native-windows-release.result }}
        run: |
          test "$MANIFEST_TESTS" = success
          test "$PUBLISHED_ASSETS" = success
          test "$NATIVE_WINDOWS_RELEASE" = success
